# DataHub trên GKE, dùng lại Postgres và Kafka (Strimzi) sẵn có; chart prerequisites chỉ còn OpenSearch:
#   helm install prerequisites datahub/datahub-prerequisites --version 0.3.1 -n data -f k8s/datahub-values.yaml
#   helm install datahub datahub/datahub --version 1.1.11 -n data -f k8s/datahub-values.yaml
# Hai chart đọc chung file, khoá của chart này bị chart kia bỏ qua. Secret datahub-secrets có key postgres-password.
# --- datahub-prerequisites (OpenSearch bật sẵn, singleNode) ---
kafka: { enabled: false }          # dùng Kafka booking (k8s/kafka.yaml)
mysql: { enabled: false }          # dùng Postgres sẵn có, database datahub
opensearch:
  opensearchJavaOpts: "-Xms1g -Xmx1g"
  resources: { requests: { cpu: 500m, memory: 2Gi }, limits: { memory: 3Gi } }
  persistence: { size: 30Gi }
  serviceMonitor: { enabled: false }   # chart 0.3.1 không đặt mặc định -> helm template lỗi nil pointer
# --- datahub ---
global:
  # GMS bật xác thực (mặc định chart 1.1.11; tắt thì job system-update thiếu DATAHUB_SYSTEM_CLIENT_SECRET và fail):
  # Airflow và job ingest gửi kèm Personal Access Token (Connection datahub_rest_default, secret datahub-token)
  kafka:
    bootstrap: { server: booking-kafka-bootstrap.data.svc.cluster.local:9092 }
  sql:
    datasource:
      host: postgres.data.svc.cluster.local:5432
      hostForpostgresqlClient: postgres.data.svc.cluster.local
      port: "5432"
      url: jdbc:postgresql://postgres.data.svc.cluster.local:5432/datahub
      driver: org.postgresql.Driver
      database: datahub
      username: postgres
      password: { secretRef: datahub-secrets, secretKey: postgres-password }
postgresqlSetupJob: { enabled: true }       # tạo bảng metadata_aspect_v2; database datahub phải tạo trước (create database)
acryl-datahub-actions: { enabled: false }   # không ingest qua UI; ingest bằng CLI (governance/datahub/*.yml)
