# Airflow trên GKE: helm install airflow apache-airflow/airflow --version 1.16.0 -n data -f k8s/airflow-values.yaml
# KubernetesExecutor (mỗi task 1 pod, không cần Redis/Celery); metadata DB là database airflow trên Postgres sẵn có.
# Connection và Variable tạo bằng CLI sau khi cài (lưu trong metadata DB, thấy được ở Admin > Connections).
executor: KubernetesExecutor
images:
  airflow: { repository: REGISTRY/data/airflow-booking, tag: TAG, pullPolicy: IfNotPresent }
postgresql: { enabled: false }
redis: { enabled: false }
statsd: { enabled: false }
data:
  metadataSecretName: airflow-metadata          # key connection = postgresql://postgres:<pw>@postgres.data.svc.cluster.local:5432/airflow
env:
  - { name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "False" }
  - { name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION, value: "True" }
  - { name: AIRFLOW__SECRETS__USE_CACHE, value: "True" }   # Variable.get lúc parse DAG (bronze_tables) đọc cache, không DB
  # pod task bị xoá khi xong (KubernetesExecutor) nên log phải lên MinIO thì UI mới đọc lại được
  - { name: AIRFLOW__LOGGING__REMOTE_LOGGING, value: "True" }
  - { name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER, value: "s3://lake/airflow-logs" }
  - { name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID, value: minio_landing }
dags:
  persistence: { enabled: false }
  gitSync: { enabled: false }                   # DAG nằm trong image (k8s/airflow.Dockerfile)
triggerer:
  persistence: { enabled: false }
workers:
  # task pod: spark-submit chỉ chờ driver; validate_* đọc Bronze từng shard (~2,4 triệu dòng quotes / shard)
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
