# Quyền cho Spark on Kubernetes (cluster mode) trong namespace data:
# - task pod Airflow (ServiceAccount airflow-worker của chart) chạy spark-submit -> tạo pod driver, service, configmap
# - driver (ServiceAccount spark, edai1/dags/spark_conf.py) tạo và xoá pod executor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-submit
  namespace: data
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims]
    verbs: [create, get, list, watch, delete, deletecollection, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-submit
  namespace: data
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: spark-submit }
subjects:
  - { kind: ServiceAccount, name: spark, namespace: data }
  - { kind: ServiceAccount, name: airflow-worker, namespace: data }
