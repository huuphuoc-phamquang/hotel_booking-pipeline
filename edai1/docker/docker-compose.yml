# Rubric edai-1 › Engineering Fundamentals › "Có sử dụng Docker & Docker Compose"
# Chạy data platform local cho booking app: MinIO (nguồn batch), Kafka (stream),
# offline-generator và event-replayer (cùng 1 image multistage ở Dockerfile, khác lệnh chạy).
# Secret lấy từ file .env (không commit), không viết thẳng trong compose.
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:1ec745a06a986762f89e68e855fc189f403941eff8c0a5f94767e92c8e39d3f5   # minio/minio đã rời Docker Hub
    user: "0"                                       # volume Docker thuộc root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]          # image minio không có curl
      interval: 10s
      retries: 5

  kafka:
    image: bitnamilegacy/kafka:3.7                  # bitnami/* đã rời Docker Hub công khai (2025)
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092   # client trong mạng compose gọi kafka:9092
    ports: ["9092:9092"]

  offline-generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
    command: ["0", "395"]                           # [0, 365) lịch sử chụp ở ngày 365; [365, 395) = lô batch chụp ngày hôm sau
                                                    # (cùng booking với stream); chạy lại ghi đè đúng các partition đó
    depends_on:
      minio:
        condition: service_healthy

  event-replayer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    entrypoint: ["python", "-m", "generator.stream_gen"]
    command: ["365", "395", "60"]                   # 30 ngày sau batch, 1 phút giả lập = 1 giây thật
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      EVENT_DIR: /data/events
    volumes: [event-log:/data/events]               # giữ event log để replay lại y hệt
    depends_on: [kafka]

volumes:
  minio-data:
  event-log:
