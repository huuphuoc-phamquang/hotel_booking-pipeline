# Pod agent của Jenkins (plugin Kubernetes): 1 container công cụ + Docker-in-Docker để build image.
# Image ci-tools (python 3.12 + docker CLI + helm + kubectl) build 1 lần từ ci/tools.Dockerfile.
apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins-deployer       # RBAC đủ quyền helm upgrade vào agents, ml, kagent
  containers:
    - name: jnlp
      image: jenkins/inbound-agent:latest-jdk21
    - name: tools
      # plugin Kubernetes đọc file nguyên văn, không thay biến: đổi project GCP thì sửa đường dẫn này
      image: asia-southeast1-docker.pkg.dev/hotel-booking-edai2/booking/ci/tools:2
      command: ["sleep", "infinity"]
      env:
        - { name: DOCKER_HOST, value: tcp://localhost:2375 }
    - name: dind
      image: docker:27-dind
      securityContext: { privileged: true }
      env:
        - { name: DOCKER_TLS_CERTDIR, value: "" }
