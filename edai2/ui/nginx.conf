# nginx của Agent Workbench: phục vụ index.html, proxy /api/ sang kagent controller (A2A + /api/agents).
server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://kagent-controller.kagent.svc.cluster.local:8083;
    proxy_set_header Authorization "";   # basic auth chỉ dùng ở ingress, không chuyển tiếp
    proxy_read_timeout 300s;              # agent 3B qua tunnel có lượt mất vài chục giây
  }
}
