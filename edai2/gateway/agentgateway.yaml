# agentgateway v1.6.0 cho booking app: 1 entrypoint cho LLM, MCP server và A2A giữa các agent.
# Rubric edai-2:
#   - Setup agent gateway + security & policy  : jwtAuth (Keycloak realm agents), localRateLimit
#   - MCP Gateway                              : route /mcp, mcpAuthorization theo tool và claim role của token
#   - A2A Gateway                              : route /a2a/*, gọi agent qua gateway thay vì trực tiếp
#   - A/B test LLM versions                    : backend LLM chia weight 90/10 giữa qwen-3b và LoRA qwen-booking-v2
# LLM_HOST được thay lúc deploy (gateway/deploy.sh): host của vLLM (tunnel Cloudflare, đổi mỗi lần tunnel khởi động lại).
# Khoá vLLM chỉ nằm ở gateway (/secrets/vllm-key); agent chỉ cầm JWT do Keycloak cấp.
binds:
  - port: 3000
    listeners:
      - routes:
          # ---------- LLM: agent gọi OpenAI-compatible API ----------
          - name: llm
            matches:
              - path: { pathPrefix: /v1 }
            policies:
              jwtAuth: &jwt
                mode: strict                 # mặc định không bắt buộc có token
                issuer: http://keycloak.auth.svc.cluster.local:8080/realms/agents
                audiences: [agentgateway]
                jwks: { url: http://keycloak.auth.svc.cluster.local:8080/realms/agents/protocol/openid-connect/certs }
              localRateLimit:
                - maxTokens: 50
                  tokensPerFill: 10
                  fillInterval: 1s
              backendTLS: {}
              backendAuth: &vllm_key
                key: { file: /secrets/vllm-key }
            backends:
              - weight: 90
                ai:
                  name: qwen-v1
                  hostOverride: LLM_HOST:443
                  provider:
                    openAI: { model: qwen-3b }
              - weight: 10
                ai:
                  name: qwen-v2
                  hostOverride: LLM_HOST:443
                  provider:
                    openAI: { model: qwen-booking-v2 }

          # ---------- LLM chỉ bản v2 (cho policy-agent-v2 của A/B agent) ----------
          - name: llm-v2
            matches:
              - path: { pathPrefix: /llm-v2/v1 }
            policies:
              urlRewrite: { path: { prefix: /v1 } }
              jwtAuth: *jwt
              backendTLS: {}
              backendAuth: *vllm_key
            backends:
              - ai:
                  name: qwen-v2-only
                  hostOverride: LLM_HOST:443
                  provider:
                    openAI: { model: qwen-booking-v2 }

          # ---------- MCP Gateway ----------
          - name: mcp
            matches:
              - path: { pathPrefix: /mcp }
            policies:
              jwtAuth: *jwt
              mcpAuthorization:
                rules:
                  # token role=data-agent chỉ thấy/gọi tool đọc feature; tool dự đoán/RAG/bán vượt dành cho policy-agent
                  - 'mcp.tool.name == "get_booking_features" && jwt.role == "data-agent"'
                  - 'mcp.tool.name in ["predict_cancellation", "search_policy", "propose_overbooking", "apply_overbooking"] && jwt.role == "policy-agent"'
            backends:
              - mcp:
                  targets:
                    - name: booking-tools
                      mcp: { host: http://booking-mcp.agents.svc.cluster.local/mcp/ }   # Service mở cổng 80 (targetPort 8000)

          # ---------- A2A Gateway: /a2a/<agent>/ -> pod agent (kagent phục vụ A2A ở /) ----------
          - name: a2a-data-agent
            matches:
              - path: { pathPrefix: /a2a/data-agent }
            policies:
              a2a: {}
              jwtAuth: *jwt
              urlRewrite: { path: { prefix: / } }
            backends:
              - host: data-agent.kagent.svc.cluster.local:8080

          # shortcut: chưa có policy-agent-v2 (giai đoạn D) nên 100% về policy-agent; thêm backend v2 weight 50 khi có
          - name: a2a-policy-agent
            matches:
              - path: { pathPrefix: /a2a/policy-agent }
            policies:
              a2a: {}
              jwtAuth: *jwt
              urlRewrite: { path: { prefix: / } }
            backends:
              - host: policy-agent.kagent.svc.cluster.local:8080

          - name: a2a-coordinator
            matches:
              - path: { pathPrefix: /a2a/coordinator-agent }
            policies:
              a2a: {}
              jwtAuth: *jwt
              urlRewrite: { path: { prefix: / } }
            backends:
              - host: coordinator-agent.kagent.svc.cluster.local:8080
