# Trace: Jaeger all-in-one nhận OTLP (gRPC 4317) từ booking-mcp (OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger-collector.monitoring:4317)
# và agentgateway; UI jaeger-query:16686 qua ingress jaeger.booking.local. Bộ nhớ in-memory: đủ cho demo 1 tuần.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.11.0
          ports: [{ containerPort: 4317 }, { containerPort: 16686 }]
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
spec:
  selector: { app: jaeger }
  ports: [{ name: otlp-grpc, port: 4317 }]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
spec:
  selector: { app: jaeger }
  ports: [{ name: http, port: 16686 }]
