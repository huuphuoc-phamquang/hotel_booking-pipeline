{{- if .Values.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels: { release: kube-prometheus-stack }    # selector mặc định của kube-prometheus-stack
spec:
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
