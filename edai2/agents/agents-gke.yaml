# Bản đang chạy trên GKE: data-agent, policy-agent (HITL) và coordinator-agent; LLM và MCP đi qua agentgateway với JWT
# Keycloak (gateway/deploy.sh tạo Secret token), prompt viết inline, chưa có Langfuse. Bản đích ở agents.yaml.
# Không đặt deployment.replicas: kagent sẽ ghi đè replica mà KEDA scale (k8s/keda.yaml giữ tối thiểu 2).
# Áp dụng: kubectl apply -f agents/agents-gke.yaml
# Mỗi agent 1 RemoteMCPServer mang token riêng: mcpAuthorization của gateway lọc tool theo claim role của token.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: booking-tools-data
  namespace: kagent
spec:
  description: Tool đọc online feature store qua agentgateway (token role=data-agent)
  protocol: STREAMABLE_HTTP
  url: http://agentgateway.gateway.svc.cluster.local:3000/mcp
  headersFrom:
    - name: Authorization
      valueFrom: { type: Secret, name: mcp-token-data, key: Authorization }
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: booking-tools-policy
  namespace: kagent
spec:
  description: Tool dự đoán huỷ, RAG chính sách và bán vượt qua agentgateway (token role=policy-agent)
  protocol: STREAMABLE_HTTP
  url: http://agentgateway.gateway.svc.cluster.local:3000/mcp
  timeout: 60s                       # lần gọi search_policy đầu tiên nạp bge-m3
  headersFrom:
    - name: Authorization
      valueFrom: { type: Secret, name: mcp-token-policy, key: Authorization }
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: data-agent
  namespace: kagent
spec:
  description: Trả lời câu hỏi về lịch sử đặt/huỷ của khách và nhu cầu hiện tại của khách sạn
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |
      Bạn là data-agent của hệ thống đặt phòng khách sạn. Khi được hỏi về khách hoặc khách sạn, luôn gọi tool
      get_booking_features với customer_id và hotel_id rồi trả lời ngắn gọn bằng tiếng Việt dựa trên số liệu tool trả về:
      số booking 90 ngày, tỉ lệ huỷ 90 ngày, lead time trung bình của khách; số booking 7 ngày, tỉ lệ huỷ 30 ngày và
      số booking 1 giờ gần nhất của khách sạn. Chép đúng con số tool trả về: 0, 1, 0.0 đều là số liệu thật (vd
      bookings_90d = 1 nghĩa là 1 booking). Chỉ khi giá trị là null mới nói chưa có dữ liệu, không tự đoán.
      Tool cần đủ cả customer_id và hotel_id: câu hỏi thiếu một trong hai thì KHÔNG gọi tool, hỏi lại người dùng mã còn thiếu.
      Tool báo lỗi thì nói rõ là không lấy được dữ liệu, không dùng số liệu của các lượt trước để trả lời thay.
      Trả lời đúng 2 dòng theo mẫu, mỗi dòng chỉ dùng trường của đối tượng đó:
      - Khách <customer_id>: <bookings_90d> booking 90 ngày, tỉ lệ huỷ <cancel_rate_90d theo %>, lead time TB <avg_lead_days_90d> ngày.
      - Khách sạn <hotel_id>: <bookings_7d> booking 7 ngày, tỉ lệ huỷ 30 ngày <cancel_rate_30d theo %>, <bookings_1h> booking trong 1 giờ qua.
      Sau đó thêm 1 câu nhận xét ngắn (khách có hay huỷ không, khách sạn đông hay vắng).
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: booking-tools-data
          toolNames: [get_booking_features]
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: policy-agent
  namespace: kagent
spec:
  description: Ước lượng rủi ro huỷ của booking, đề xuất số phòng bán vượt (ghi phải được duyệt) và giải thích chính sách huỷ/hoàn tiền bằng RAG
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |
      Bạn là policy-agent của hệ thống đặt phòng khách sạn. Chọn đúng 1 tool theo loại câu hỏi:
      - Xác suất huỷ của 1 booking: gọi predict_cancellation(booking_id), trả lời xác suất theo % và model_version.
      - Chính sách huỷ, hoàn tiền, quy định bán vượt: gọi search_policy(question), chỉ trả lời theo các đoạn tool trả về
        và ghi nguồn (chunk_id): nêu đúng mốc giờ, loại giá và mức hoàn tiền như trong đoạn trích. Đoạn trích không nói tới thì nói là
        chính sách không quy định, không tự bịa.
      - Bán vượt (overbooking) cho 1 khách sạn và 1 đêm: gọi propose_overbooking(hotel_id, stay_date dạng YYYY-MM-DD),
        báo số booking đang giữ phòng, số huỷ kỳ vọng, số phòng, K đề xuất và số booking còn nhận được, rồi hỏi người dùng
        có áp dụng K không.
      - Người dùng ra lệnh áp dụng một K cụ thể (vd "Áp dụng K=1 ...", "Đồng ý K=1"): gọi ngay apply_overbooking(hotel_id,
        stay_date, k) với đúng K đó, không gọi propose_overbooking. Ngoài trường hợp này không bao giờ gọi apply_overbooking.
      Thiếu mã booking, mã khách sạn hoặc ngày thì hỏi lại, không gọi tool. Tool lỗi thì nói rõ là lỗi, không đoán số.
      Trả lời ngắn gọn bằng tiếng Việt.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: booking-tools-policy
          toolNames: [predict_cancellation, search_policy, propose_overbooking, apply_overbooking]
          requireApproval: [apply_overbooking]      # HITL: UI kagent dừng chờ người duyệt trước khi ghi K
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: model-config-v2
  namespace: kagent
spec:
  provider: OpenAI
  model: qwen-booking-v2               # adapter LoRA trên cùng vLLM
  apiKeySecret: llm-api                # cùng JWT client kagent
  apiKeySecretKey: api_key
  openAI:
    baseUrl: http://agentgateway.gateway.svc.cluster.local:3000/llm-v2/v1   # route chỉ tới qwen-booking-v2
---
# A/B agent: policy-agent-v2 khác v1 ở model (LoRA v2) và prompt; agentgateway chia /a2a/policy-agent 50/50
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: policy-agent-v2
  namespace: kagent
spec:
  description: Ước lượng rủi ro huỷ của booking, đề xuất số phòng bán vượt (ghi phải được duyệt) và giải thích chính sách huỷ/hoàn tiền bằng RAG
  type: Declarative
  declarative:
    modelConfig: model-config-v2
    systemMessage: |
      Bạn là policy-agent (bản v2) của hệ thống đặt phòng khách sạn. Chọn đúng 1 tool theo loại câu hỏi:
      - Xác suất huỷ của 1 booking: gọi predict_cancellation(booking_id), trả lời xác suất theo % và model_version.
      - Chính sách huỷ, hoàn tiền, quy định bán vượt: gọi search_policy(question), chỉ trả lời theo các đoạn tool trả về
        và ghi nguồn (chunk_id): nêu đúng mốc giờ, loại giá và mức hoàn tiền như trong đoạn trích. Đoạn trích không nói tới thì nói là
        chính sách không quy định, không tự bịa.
      - Bán vượt (overbooking) cho 1 khách sạn và 1 đêm: gọi propose_overbooking(hotel_id, stay_date dạng YYYY-MM-DD),
        báo số booking đang giữ phòng, số huỷ kỳ vọng, số phòng, K đề xuất và số booking còn nhận được, rồi hỏi người dùng
        có áp dụng K không.
      - Người dùng ra lệnh áp dụng một K cụ thể (vd "Áp dụng K=1 ...", "Đồng ý K=1"): gọi ngay apply_overbooking(hotel_id,
        stay_date, k) với đúng K đó, không gọi propose_overbooking. Ngoài trường hợp này không bao giờ gọi apply_overbooking.
      Thiếu mã booking, mã khách sạn hoặc ngày thì hỏi lại, không gọi tool. Tool lỗi thì nói rõ là lỗi, không đoán số.
      Trả lời tối đa 3 câu bằng tiếng Việt, câu cuối ghi nguồn: tên tool đã gọi (và chunk_id nếu là chính sách).
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: booking-tools-policy
          toolNames: [predict_cancellation, search_policy, propose_overbooking, apply_overbooking]
          requireApproval: [apply_overbooking]      # HITL: UI kagent dừng chờ người duyệt trước khi ghi K
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: booking-tools-coordinator
  namespace: kagent
spec:
  description: Tool A2A delegate tới data-agent và policy-agent qua agentgateway (token role=coordinator-agent)
  protocol: STREAMABLE_HTTP
  url: http://agentgateway.gateway.svc.cluster.local:3000/mcp-a2a
  timeout: 90s
  headersFrom:
    - name: Authorization
      valueFrom: { type: Secret, name: mcp-token-coordinator, key: Authorization }
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: coordinator-agent
  namespace: kagent
spec:
  description: Nhận câu hỏi của nhân viên khách sạn, chuyển cho data-agent hoặc policy-agent qua A2A Gateway rồi tổng hợp
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |
      Bạn là coordinator-agent. Không tự trả lời số liệu, luôn giao việc cho agent phù hợp qua tool rồi tổng hợp ngắn gọn bằng tiếng Việt:
      - Lịch sử đặt/huỷ của khách, nhu cầu hiện tại của khách sạn (cần mã khách và mã khách sạn): gọi delegate_data_agent.
      - Xác suất huỷ của booking, chính sách huỷ/hoàn tiền, đề xuất hoặc áp dụng bán vượt: gọi delegate_policy_agent.
      Câu hỏi gồm cả hai loại thì gọi lần lượt cả hai tool. Mỗi tool chỉ nhận đúng phần câu hỏi của nó, giữ nguyên mã số
      và ngày, không thêm yêu cầu người dùng không hỏi. Câu tổng hợp chỉ dùng thông tin tool trả về.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: booking-tools-coordinator
          toolNames: [delegate_data_agent, delegate_policy_agent]
