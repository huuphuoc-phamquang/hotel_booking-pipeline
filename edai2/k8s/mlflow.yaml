# MLflow tracking + model registry cho pipeline cancel-risk (ml/training_pipeline.py: MLFLOW_URI = mlflow.mlops:5000).
# Metadata trên Postgres (database mlflow), artifact (model, dữ liệu, reference_lead_days.npy) trên MinIO bucket mlflow.
# --serve-artifacts: client chỉ gọi HTTP tới server, không cần khoá MinIO.
# Secret mlflow-secrets (namespace mlops): backend_uri, aws_access_key_id, aws_secret_access_key.
#   kubectl apply -f k8s/mlflow.yaml   (thay REGISTRY như các manifest khác)
apiVersion: v1
kind: Namespace
metadata: { name: mlops }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mlflow, namespace: mlops }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow } }
  template:
    metadata: { labels: { app: mlflow } }
    spec:
      containers:
        - name: mlflow
          image: REGISTRY/ml/mlflow:3.6.0
          command: ["sh", "-c"]
          args:
            - >-
              exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri "$BACKEND_URI"
              --artifacts-destination s3://mlflow --serve-artifacts
              --allowed-hosts "mlflow.mlops.svc.cluster.local:5000,mlflow.mlops:5000,mlflow:5000,localhost:5000"
          env:
            - name: BACKEND_URI
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: backend_uri } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: aws_access_key_id } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mlflow-secrets, key: aws_secret_access_key } }
            - { name: MLFLOW_S3_ENDPOINT_URL, value: "http://minio.data.svc.cluster.local:9000" }
          ports: [{ containerPort: 5000 }]
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: mlflow, namespace: mlops }
spec:
  selector: { app: mlflow }
  ports: [{ port: 5000, targetPort: 5000 }]
