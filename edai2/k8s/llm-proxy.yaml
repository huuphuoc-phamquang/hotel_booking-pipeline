# Proxy telemetry cho LLM (llm_metrics.py): mở /v1/chat/completions và /metrics cho Prometheus scrape.
# Code nạp từ ConfigMap llm-proxy-code (tạo từ observability/llm_metrics.py và llm_proxy.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-proxy
  namespace: gateway
  labels:
    app: llm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-proxy
  template:
    metadata:
      labels:
        app: llm-proxy
    spec:
      containers:
        - name: llm-proxy
          image: asia-southeast1-docker.pkg.dev/hotel-booking-edai2/booking/agents/booking-mcp:762fa7b
          command: ["uvicorn", "llm_proxy:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: PYTHONPATH
              value: /proxy
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - name: code
              mountPath: /proxy
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: llm-proxy-code
---
apiVersion: v1
kind: Service
metadata:
  name: llm-proxy
  namespace: gateway
  labels:
    app: llm-proxy
spec:
  selector:
    app: llm-proxy
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-proxy
  namespace: gateway
  labels:
    app: llm-proxy
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: llm-proxy
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
