# kagent 0.9.12: bản cuối dùng API kagent.dev/v1alpha2 (agents/agents.yaml, Agent Declarative + deployment.replicas).
# kagent 1.x đổi sang api.kagent.dev/v1alpha3 và bắt buộc Agent Substrate (WorkerPool + snapshot S3), quá nặng cho cluster
# 12 vCPU. Chỉ giữ controller + UI; tắt các agent / tool server có sẵn của chart.
#   helm install kagent-crds oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds --version 0.9.12 -n kagent --create-namespace
#   helm install kagent oci://ghcr.io/kagent-dev/kagent/helm/kagent --version 0.9.12 -n kagent -f k8s/kagent-values.yaml \
#     --set database.postgres.url=<DSN database kagent>        # chạy sau gateway/deploy.sh (tạo Secret llm-api)
# Secret llm-api (key api_key) chứa JWT của client kagent (gateway/deploy.sh cấp); khoá vLLM chỉ nằm ở agentgateway.
database:
  postgres:
    bundled: { enabled: false }       # dùng Postgres sẵn có của data platform (database kagent), không thêm pod
providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: qwen-3b                    # vLLM (Qwen2.5-3B-Instruct, tool calling parser hermes)
    apiKeySecretRef: llm-api
    apiKeySecretKey: api_key
    config:
      baseUrl: http://agentgateway.gateway.svc.cluster.local:3000/v1
kmcp: { enabled: false }
kagent-tools: { enabled: false }
k8s-agent: { enabled: false }
kgateway-agent: { enabled: false }
istio-agent: { enabled: false }
promql-agent: { enabled: false }
observability-agent: { enabled: false }
argo-rollouts-agent: { enabled: false }
helm-agent: { enabled: false }
cilium-policy-agent: { enabled: false }
cilium-manager-agent: { enabled: false }
cilium-debug-agent: { enabled: false }
grafana-mcp: { enabled: false }
querydoc: { enabled: false }
