# KEDA 2.20 (helm kedacore/keda, namespace keda) thay HPA CPU: mỗi ScaledObject tự tạo HPA keda-hpa-<tên>, không để
# HPA khác cùng target. Agent scale theo request/s qua agentgateway (agentgateway_requests_total, nhãn route
# "default/a2a-<agent>", ServiceMonitor trong k8s/agentgateway.yaml); coordinator thêm trigger cpu (KEDA lấy replica lớn nhất).
# kagent reconcile lại deployment.replicas nếu Agent có trường đó, nên Agent trong agents/agents-gke.yaml KHÔNG đặt
# deployment.replicas; ScaledObject giữ tối thiểu 2 replica. Mỗi lượt agent chờ LLM ~5 s nên ngưỡng 1 req/s/replica.
# shortcut: tối đa 4 replica vì cluster 12 vCPU; lời gọi coordinator -> agent con không qua gateway nên không tính vào
# metric của data-agent / policy-agent.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: data-agent
  namespace: kagent
spec:
  scaleTargetRef: { name: data-agent }
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: sum(rate(agentgateway_requests_total{route="default/a2a-data-agent"}[1m]))
        threshold: "1"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: policy-agent
  namespace: kagent
spec:
  scaleTargetRef: { name: policy-agent }
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: sum(rate(agentgateway_requests_total{route="default/a2a-policy-agent",backend=~".*/backend0"}[1m]))
        threshold: "1"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: policy-agent-v2
  namespace: kagent
spec:
  scaleTargetRef: { name: policy-agent-v2 }
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: sum(rate(agentgateway_requests_total{route="default/a2a-policy-agent",backend=~".*/backend1"}[1m]))
        threshold: "1"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: coordinator-agent
  namespace: kagent
spec:
  scaleTargetRef: { name: coordinator-agent }
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: sum(rate(agentgateway_requests_total{route="default/a2a-coordinator"}[1m]))
        threshold: "1"
    - type: cpu
      metricType: Utilization
      metadata: { value: "60" }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: drift-api
  namespace: ml
spec:
  scaleTargetRef: { name: drift-api }
  # shortcut: 1 replica vì buffer cửa sổ KS nằm trong bộ nhớ pod; scale ngang cần buffer chung (Redis) hoặc KS mỗi pod
  minReplicaCount: 1
  maxReplicaCount: 1
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: sum(rate(drift_events_total[1m]))
        threshold: "200"
