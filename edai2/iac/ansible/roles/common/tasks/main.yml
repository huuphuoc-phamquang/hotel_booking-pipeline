- name: Cập nhật apt và cài gói cơ bản
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-pip, ufw]
    update_cache: true
    cache_valid_time: 3600

- name: Firewall chỉ mở SSH, Jenkins, Vault
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "8080", "8200"]

- name: Bật firewall
  community.general.ufw:
    state: enabled
    policy: deny
